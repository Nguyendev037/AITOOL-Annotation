# =============================================================================
# TAXONOMY — NGUỒN SỰ THẬT DUY NHẤT CHO LABEL
# =============================================================================
#
# Đây là file DUY NHẤT bạn sửa khi taxonomy thay đổi (ví dụ khi cập nhật tài
# liệu trong `guildlline/` hoặc `guideline/`).
#
# Mọi thứ suy ra từ file này được sinh tự động bởi `tools/sync_taxonomy.py`:
#
#   taxonomy.yaml
#        │
#        ├─► nuclio/functions/{bbox,semantic,drivable,lane}.yaml
#        │       metadata.annotations.spec   ← danh sách label CVAT hiển thị
#        │
#        ├─► model-service/taxonomy.json
#        │       model-service/handlers/detect.py   ← map COCO -> guideline
#        │       model-service/handlers/segment.py  ← map COCO -> drivable
#        │
#        ├─► nuclio/src/main.py  (qua env TAXONOMY_JSON do tools/deploy_nuclio.py nhúng)
#        │
#        └─► run_results.py      ← màu vẽ preview
#
# Kiểm tra lệch (drift) bất cứ lúc nào:   python tools/sync_taxonomy.py --check
# Sinh lại toàn bộ:                        python tools/sync_taxonomy.py --write
#
# Nguồn gốc taxonomy:
#   guildlline/Annotation_Guideline_BBox_Polygon_Polyline.pdf
#   guildlline/Semantic_Segmentation_Annotation_Guideline.pdf
#   guideline/README.md
# =============================================================================

version: 1

groups:

  # ---------------------------------------------------------------------------
  # Nhóm 1 — Object instance (Rectangle / Bounding Box)
  # ---------------------------------------------------------------------------
  - id: objects
    title: Object instance
    shape: rectangle
    task: bbox
    function: smart-bbox
    model_title: Smart BBox (YOLO26)
    help_message: >-
      Bounding boxes for the 10 guideline object classes, produced by YOLO26m.
    description: >-
      Object detection with YOLO26m, mapped to the 10 object classes of the
      annotation guideline. Returns CVAT rectangles.
    labels:
      - name: pedestrian
        coco: [person]
        color: [220, 20, 60]
      - name: rider
        coco: []
        color: [255, 120, 0]
        note: >-
          COCO detection không có class `rider`; người lái xe bị nhận là
          `person` -> `pedestrian`. Label vẫn khai báo để task có sẵn.
      - name: car
        coco: [car]
        color: [0, 0, 230]
      - name: truck
        coco: [truck]
        color: [70, 0, 0]
      - name: bus
        coco: [bus]
        color: [100, 60, 0]
      - name: train
        coco: [train]
        color: [120, 120, 120]
      - name: motorcycle
        coco: [motorcycle]
        color: [230, 0, 0]
      - name: bicycle
        coco: [bicycle]
        color: [32, 11, 119]
      - name: traffic light
        coco: [traffic light]
        color: [30, 170, 250]
      - name: traffic sign
        coco: [stop sign]
        color: [0, 220, 220]
        note: >-
          COCO không có class "biển báo chung"; chỉ xấp xỉ từ `stop sign`.

  # ---------------------------------------------------------------------------
  # Nhóm 2 — Drivable area (Polygon)
  # ---------------------------------------------------------------------------
  - id: drivable
    title: Drivable area
    shape: polygon
    task: drivable
    function: smart-drivable
    model_title: Smart Drivable Area
    help_message: >-
      Drivable-area polygons approximated from COCO road/pavement. Lane marking
      (polyline) is not supported.
    description: >-
      Drivable-area segmentation returned as CVAT polygons. `area/drivable` is
      approximated from COCO `road`, `area/alternative` from COCO
      `pavement-merged`. Lane marking is not produced.
    labels:
      - name: area/drivable
        coco: [road]
        color: [255, 165, 0]
        note: >-
          Xấp xỉ từ COCO `road`, không phải model train trên BDD100K.
      - name: area/alternative
        coco: [pavement-merged]
        color: [30, 144, 255]
        note: >-
          Xấp xỉ từ COCO `pavement-merged`.

  # ---------------------------------------------------------------------------
  # Nhóm 3 — Lane marking (Polyline)
  #
  # Function `smart-lane` chạy detector classical-CV trên CPU (không tốn VRAM).
  # Cách tiếp cận: chiếu mặt đường về ảnh "bird's-eye" theo MÉT rồi mới làm
  # top-hat / connected-components / PCA, vì bề rộng vạch tính bằng pixel thay
  # đổi hơn 10 lần trong một khung hình (f/Z).
  #
  # Hạn chế có thật, đã đo trên test/detect (25 ảnh):
  #   * chỉ trace được ~40% dưới của khung (LANE_MAX_DEPTH_M=12 m) — cap depth
  #     để bird raster không upsample nhiễu chân trời thành vạch giả;
  #   * `lane/double *` chỉ tách được khi 2 nét còn phân giải;
  #   * `lane/road curb` mặc định TẮT (LANE_CURB_ENABLED=false) — curb là biên
  #     độ sâu, không phải vạch sáng; detector pure-CV cho quá nhiều FP.
  # ---------------------------------------------------------------------------
  - id: lane
    title: Lane marking
    shape: polyline
    task: lane
    function: smart-lane
    model_title: Smart Lane Marking (Polyline)
    help_message: >-
      Lane markings as polylines, produced by a CPU-only classical-CV detector
      on a metric bird's-eye view of the road.
    description: >-
      Lane-marking polylines from a CPU-only classical-CV detector. Scores the
      road plane in metres via a bird's-eye view, so widths and gaps do not
      drift with distance. No VRAM cost. Recall is limited: markings are traced
      over roughly the bottom 40% of the frame, and lane/road curb is off by
      default.
    labels:
      - name: lane/crosswalk
        coco: []
        color: [0, 220, 220]
      - name: lane/double white
        coco: []
        color: [255, 255, 255]
      - name: lane/double yellow
        coco: []
        color: [255, 215, 0]
      - name: lane/road curb
        coco: []
        color: [255, 0, 255]
        note: >-
          Mặc định tắt (LANE_CURB_ENABLED=false). Curb là biên độ sâu chứ không
          phải vạch sáng; detector gradient cho quá nhiều false positive.
      - name: lane/single other
        coco: []
        color: [150, 150, 255]
        note: >-
          Vạch không phân loại được là trắng hay vàng (colour vote không đạt
          ngưỡng), hoặc vạch đôi màu không xác định.
      - name: lane/single white
        coco: []
        color: [0, 255, 0]
      - name: lane/single yellow
        coco: []
        color: [255, 140, 0]

  # ---------------------------------------------------------------------------
  # Nhóm 4 — Semantic segmentation (19 class Cityscapes)
  # ---------------------------------------------------------------------------
  - id: semantic
    title: Semantic segmentation
    shape: polygon
    task: semantic
    function: smart-semantic
    model_title: Smart Semantic (EoMT COCO)
    help_message: >-
      COCO-panoptic semantic segmentation mapped to the 19-class taxonomy.
      `pole` and `rider` are unavailable; `traffic_sign` is approximated from
      COCO stop sign.
    description: >-
      Semantic segmentation via EoMT-DINOv3 COCO-panoptic, mapped onto the
      19-class Cityscapes taxonomy and returned as CVAT polygons. Approximate:
      COCO has no `pole` or `rider`, and `traffic_sign` comes from `stop_sign`.
    labels:
      - name: road
        coco: [road]
      - name: sidewalk
        coco: [pavement-merged, platform]
      - name: building
        coco: [building-other-merged, house]
      - name: wall
        coco: [wall-brick, wall-stone, wall-tile, wall-wood, wall-other-merged]
      - name: fence
        coco: [fence-merged]
      - name: pole
        coco: []
        note: COCO panoptic không có class cột/trụ -> không bao giờ sinh ra.
      - name: traffic_light
        coco: [traffic_light]
      - name: traffic_sign
        coco: [stop_sign]
        note: Xấp xỉ từ COCO `stop_sign`.
      - name: vegetation
        coco: [tree-merged, grass-merged, flower]
      - name: terrain
        coco: [dirt-merged, sand, mountain-merged, rock-merged, gravel, snow]
      - name: sky
        coco: [sky-other-merged]
      - name: person
        coco: [person]
      - name: rider
        coco: []
        note: COCO panoptic không có class người lái -> không bao giờ sinh ra.
      - name: car
        coco: [car]
      - name: truck
        coco: [truck]
      - name: bus
        coco: [bus]
      - name: train
        coco: [train]
      - name: motorcycle
        coco: [motorcycle]
      - name: bicycle
        coco: [bicycle]

  # ---------------------------------------------------------------------------
  # Nhóm 5 — HumanPose-17 (Skeleton 17 điểm)
  #
  # Vì sao nhóm này KHÔNG có `function`: bài này chạy tại chỗ bằng MediaPipe
  # trong tiến trình browser-agent (`browser_agent/vision/`), không phục vụ qua
  # model-service và không có nuclio function. Thiếu `function` là đúng chủ ý —
  # `tools/models.py sync-cvat` bỏ qua nó thay vì đi tìm function không tồn tại.
  #
  # 17 sublabel đặt tên "1".."17" cho khớp `browser_agent/geometry.sublabel_name`,
  # nơi sublabel luôn là chuỗi số. Đổi tên ở đây là phá luồng ghi CVAT.
  # ---------------------------------------------------------------------------
  - id: pose17
    title: HumanPose-17
    shape: skeleton
    task: pose17
    local: true
    model_title: Smart HumanPose-17 (MediaPipe)
    help_message: >-
      Skeleton 17 điểm theo guideline HumanPose-17, chạy tại chỗ bằng MediaPipe.
    description: >-
      HumanPose-17 qua MediaPipe Pose, chạy trong tiến trình browser-agent nên
      không tốn VRAM và không có nuclio function. Trái/phải được chọn theo toạ độ
      từng ảnh (quyết định B), không theo nhãn giải phẫu của model.
    labels:
      - name: "1"
      - name: "2"
      - name: "3"
      - name: "4"
      - name: "5"
      - name: "6"
      - name: "7"
      - name: "8"
      - name: "9"
      - name: "10"
      - name: "11"
      - name: "12"
      - name: "13"
      - name: "14"
      - name: "15"
      - name: "16"
      - name: "17"

  # ---------------------------------------------------------------------------
  # Nhóm 6 — Face Landmark VF-50 (Skeleton 50 điểm)
  #
  # Cùng lý do nhóm 5: chạy tại chỗ bằng MediaPipe FaceMesh, không có function.
  # 50 sublabel "0".."49" — chú ý guideline VF-50 đánh số từ 0, khác HumanPose-17
  # đánh số từ 1. Đây là điểm dễ nhầm nhất giữa hai bài.
  # ---------------------------------------------------------------------------
  - id: face50
    title: Face Landmark VF-50
    shape: skeleton
    task: face50
    local: true
    model_title: Smart Face Landmark VF-50 (MediaPipe)
    help_message: >-
      Skeleton 50 điểm theo guideline Face Landmark VF-50, chạy tại chỗ bằng MediaPipe.
    description: >-
      Face Landmark VF-50 qua MediaPipe FaceMesh (468 đỉnh, dùng 50 điểm theo
      guideline). Chạy trong tiến trình browser-agent. 7 nhóm con (lông mày, mắt,
      sống mũi, môi) nằm trong `browser_agent/geometry.FACE_SKELETONS`.
    labels:
      - name: "0"
      - name: "1"
      - name: "2"
      - name: "3"
      - name: "4"
      - name: "5"
      - name: "6"
      - name: "7"
      - name: "8"
      - name: "9"
      - name: "10"
      - name: "11"
      - name: "12"
      - name: "13"
      - name: "14"
      - name: "15"
      - name: "16"
      - name: "17"
      - name: "18"
      - name: "19"
      - name: "20"
      - name: "21"
      - name: "22"
      - name: "23"
      - name: "24"
      - name: "25"
      - name: "26"
      - name: "27"
      - name: "28"
      - name: "29"
      - name: "30"
      - name: "31"
      - name: "32"
      - name: "33"
      - name: "34"
      - name: "35"
      - name: "36"
      - name: "37"
      - name: "38"
      - name: "39"
      - name: "40"
      - name: "41"
      - name: "42"
      - name: "43"
      - name: "44"
      - name: "45"
      - name: "46"
      - name: "47"
      - name: "48"
