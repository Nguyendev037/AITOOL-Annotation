  # ---------------------------------------------------------------------------
  # Nhóm 7 — LiDAR 3D (Cuboid) — chỗ dành sẵn, chưa có model
  #
  # Nhóm này tồn tại để `models.yaml` khai được hợp đồng cho model LiDAR bổ sung
  # sau, đúng yêu cầu "chừa hợp đồng cho model LiDAR 3D". Bản LiDAR v1 KHÔNG dùng
  # nhóm này: nó fit cuboid bằng hình học, không phân lớp vật thể, nên cố ý để
  # `supported: false` và không có model nào bật.
  # ---------------------------------------------------------------------------
  - id: lidar3d
    title: LiDAR 3D cuboid
    shape: cuboid_3d
    task: lidar3d
    local: true
    supported: false
    unsupported_reason: >-
      Chưa có model 3D đã kiểm chứng. LiDAR v1 chỉ fit cuboid hình học từ vùng
      điểm người dùng chọn và không tự nhận diện lớp vật thể.
    labels:
      - name: Object3D
